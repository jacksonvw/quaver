<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Minim app icon: a minim (half note) — open notehead + stem.
       Visually paired with Quaver's "Q + EQ bars" by sharing the
       white-on-transparent treatment, sized for dark themes. -->

  <!-- Open notehead: rotated ellipse, hollow (stroke-only). -->
  <g transform="translate(96 168) rotate(-22)">
    <ellipse cx="0" cy="0" rx="46" ry="32"
             fill="none" stroke="white" stroke-width="14"/>
  </g>

  <!-- Stem: tall thin bar on the right side of the notehead. -->
  <rect x="135" y="40" width="14" height="146" rx="4" ry="4" fill="white"/>
</svg>
