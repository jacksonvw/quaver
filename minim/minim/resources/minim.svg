<!-- Minim: a minim (half note), drawn the way it is engraved: the head tilts
     20 degrees, its counter tilts more steeply so the sides are heavier than
     the top and bottom, and the stem's right edge sits on the head's
     rightmost tangent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <path fill="#FFFFFF" fill-rule="evenodd" d="M 11.869 10.166 A 4.5 3.1 -20 1 1 3.412 13.244 A 4.5 3.1 -20 1 1 11.869 10.166 Z M 9.847 9.982 A 2.8 1.3 -38 1 1 5.434 13.429 A 2.8 1.3 -38 1 1 9.847 9.982 Z"/>
  <rect x="10" y="1" width="2" height="10.521" fill="#FFFFFF"/>
</svg>
