# libass renders ASS/SSA subtitles; media_core loads it through ctypes
# (core/libass_renderer.py). FreeType, FriBidi, HarfBuzz and Fontconfig are
# in the KDE runtime.
name: libass
config-opts:
  - --disable-static
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
sources:
  - type: archive
    url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
    sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
