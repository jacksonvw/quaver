# PyGObject, which media_core plays through: the KDE runtime has GStreamer
# and its introspection data, but not the Python bindings.
name: pygobject
buildsystem: meson
config-opts:
  - -Dpycairo=disabled
  - -Dtests=false
cleanup:
  - /include
  - /lib/pkgconfig
sources:
