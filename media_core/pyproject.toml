[project]
name = "media_core"
version = "0.0.1"
description = "Shared media engine + UI primitives for Quaver and Minim"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "PySide6>=6.6",
    "mutagen>=1.47",
    "platformdirs>=4.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
linux = [
    "dbus-python>=1.3",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
