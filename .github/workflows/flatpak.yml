# Builds the Flatpaks and publishes them, signed, as a Flatpak repository on
# GitHub Pages; flatpak/README.md has how to install from it. PySide6 is tied
# to one exact Qt release, so besides each push to main, a daily run rebuilds
# whenever KDE's runtime or Qt's base app has moved since the last publish,
# and an installed copy then updates with the rest of the system's Flatpaks.
name: Flatpak

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak
  cancel-in-progress: false

env:
  APPS: com.jacksonv.Quaver com.jacksonv.Minim
  TITLE: Quaver and Minim
  SITE: https://jacksonvw.github.io/quaver/
  DEPS: org.kde.Platform//6.11 org.kde.Sdk//6.11 io.qt.PySide.BaseApp//6.11

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq flatpak flatpak-builder
          # Ubuntu's AppArmor otherwise stops bubblewrap making the
          # namespaces each build step runs in.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo

      # A push or a manual run always builds. The daily run builds only when
      # the runtime, SDK or base app has a commit the last publish wasn't
      # built from; a failed build publishes nothing, so it retries next day.
      - name: Check what moved
        id: check
        run: |
          for ref in $DEPS; do
              echo "$ref $(flatpak remote-info --user -c flathub "$ref")"
          done > "$RUNNER_TEMP/deps.txt"
          cat "$RUNNER_TEMP/deps.txt"
          if [ "$GITHUB_EVENT_NAME" != schedule ] ||
             ! curl -fsS "${SITE}deps.txt" | cmp -s - "$RUNNER_TEMP/deps.txt"; then
              echo build=true >> "$GITHUB_OUTPUT"
          fi

      # The KDE SDK and the base app need more room than the runner has free.
      - name: Free disk space
        if: steps.check.outputs.build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      # Everything built lives outside the checkout, which each manifest
      # copies into its build whole.
      - name: Build
        if: steps.check.outputs.build
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          cd "$RUNNER_TEMP"
          echo "$GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          flatpak install --user -y --noninteractive flathub $DEPS
          for app in $APPS; do
              flatpak-builder --user --force-clean --gpg-sign="$key" \
                  --repo=repo "build/$app" "$GITHUB_WORKSPACE/flatpak/$app.yml"
          done
          flatpak build-update-repo --gpg-sign="$key" --title="$TITLE" \
              --default-branch=master repo
          echo "key=$key" >> "$GITHUB_ENV"

      # The import that fails when PySide6 and the runtime's Qt disagree.
      - name: Check PySide6 loads
        if: steps.check.outputs.build
        run: |
          flatpak remote-add --user --no-gpg-verify built "$RUNNER_TEMP/repo"
          for app in $APPS; do
              flatpak install --user -y --noninteractive built "$app"
              flatpak run --command=python3 "$app" -c \
                  'from PySide6 import QtCore, QtGui, QtWidgets; print(QtCore.qVersion())'
          done

      - name: Lay out the site
        if: steps.check.outputs.build
        run: |
          cd "$RUNNER_TEMP"
          mv repo _site
          mv deps.txt _site/
          name=$(basename "$SITE")
          {
              echo '[Flatpak Repo]'
              echo "Title=$TITLE"
              echo "Url=$SITE"
              echo "Homepage=https://github.com/$GITHUB_REPOSITORY"
              echo "GPGKey=$(gpg --export "$key" | base64 -w0)"
          } > "_site/$name.flatpakrepo"
          du -sh _site

      - if: steps.check.outputs.build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    needs: build
    if: needs.build.outputs.publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
